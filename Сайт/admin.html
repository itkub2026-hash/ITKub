<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ-панель IT-КУБ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --surface2: #1a1a25;
      --border: #252530;
      --text: #e8e8ed;
      --text2: #8b8b9e;
      --purple: #7c3aed;
      --purple-light: #a78bfa;
      --green: #10b981;
      --red: #ef4444;
      --yellow: #f59e0b;
      --radius: 14px;
      --radius-sm: 10px;
      --shadow: 0 4px 24px rgba(0,0,0,0.3);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      line-height: 1.5;
    }
    .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .card-header h2 { font-size: 1.25rem; font-weight: 600; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-primary { background: var(--purple); color: white; }
    .btn-primary:hover { background: #6d28d9; transform: translateY(-1px); }
    .btn-success { background: var(--green); color: white; }
    .btn-success:hover { background: #059669; transform: translateY(-1px); }
    .btn-danger { background: rgba(239,68,68,0.15); color: var(--red); }
    .btn-danger:hover { background: rgba(239,68,68,0.25); }
    .btn-ghost { background: transparent; color: var(--text2); }
    .btn-ghost:hover { background: var(--surface2); color: var(--text); }
    .btn-sm { padding: 6px 12px; font-size: 0.75rem; }
    .btn-icon {
      width: 36px; height: 36px; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: var(--radius-sm); background: transparent;
      color: var(--text2); border: 1px solid var(--border);
      cursor: pointer; transition: all 0.2s;
    }
    .btn-icon:hover { background: var(--surface2); color: var(--text); }
    .btn-icon.danger { color: var(--red); border-color: rgba(239,68,68,0.3); }
    .btn-icon.danger:hover { background: rgba(239,68,68,0.1); }

    input, textarea, select {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 12px 16px; color: var(--text);
      font-size: 0.9rem; font-family: inherit; transition: border 0.2s; outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--purple); }
    textarea { resize: vertical; min-height: 80px; }
    label {
      display: block; font-size: 0.8rem; color: var(--text2);
      margin-bottom: 6px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr; }
      .container { padding: 12px; }
      .card { padding: 16px; }
      .btn { padding: 10px 16px; font-size: 0.8rem; }
    }

    .tabs {
      display: flex; gap: 0; margin-bottom: 24px;
      background: var(--surface); border-radius: var(--radius);
      padding: 4px; border: 1px solid var(--border); overflow-x: auto;
    }
    .tab {
      flex: 1; padding: 12px 20px; text-align: center; cursor: pointer;
      color: var(--text2); font-weight: 500; font-size: 0.9rem;
      border-radius: var(--radius-sm); transition: all 0.2s;
      white-space: nowrap; background: transparent; border: none;
    }
    .tab.active { background: var(--purple); color: white; }
    .tab:hover:not(.active) { color: var(--text); background: var(--surface2); }

    .list-item {
      display: flex; padding: 16px; background: var(--bg);
      border-radius: var(--radius-sm); margin-bottom: 10px;
      border: 1px solid transparent; transition: all 0.2s; gap: 12px;
    }
    .list-item:hover { border-color: var(--border); background: var(--surface2); }
    .list-item-title { font-weight: 600; }
    .list-item-sub { font-size: 0.8rem; color: var(--text2); }

    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 20px;
      font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.3px; margin-right: 4px; margin-top: 2px;
    }
    .badge-purple { background: rgba(124,58,237,0.2); color: var(--purple-light); }
    .badge-green { background: rgba(16,185,129,0.2); color: var(--green); }
    .badge-yellow { background: rgba(245,158,11,0.2); color: var(--yellow); }
    .badge-red { background: rgba(239,68,68,0.2); color: var(--red); }

    .case-block {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 12px; margin-bottom: 8px;
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    }
    .case-block input { flex: 1; min-width: 150px; }

    .member-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 0; border-bottom: 1px solid var(--border);
      font-size: 0.8rem; flex-wrap: wrap; gap: 4px;
    }
    .member-row:last-child { border-bottom: none; }
    .team-detail-box {
      background: var(--surface); border-radius: var(--radius-sm);
      padding: 12px; margin-top: 4px;
    }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      backdrop-filter: blur(4px); display: flex; align-items: center;
      justify-content: center; z-index: 1000; padding: 20px;
    }
    .modal-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 32px; max-width: 440px;
      width: 100%; box-shadow: var(--shadow); text-align: center;
    }

    .color-swatch {
      width: 36px; height: 36px; border-radius: 10px;
      cursor: pointer; border: 2px solid transparent; transition: all 0.15s;
    }
    .color-swatch:hover { border-color: white; transform: scale(1.15); }

    .hidden { display: none !important; }
    .text-danger { color: var(--red); }
    .text-muted { color: var(--text2); }
    .text-sm { font-size: 0.8rem; }
    .text-xs { font-size: 0.7rem; }
    .mt-1 { margin-top: 4px; }
    .mt-2 { margin-top: 8px; }
    .mt-4 { margin-top: 16px; }
    .mb-2 { margin-bottom: 8px; }
    .mb-4 { margin-bottom: 16px; }
    .mb-6 { margin-bottom: 24px; }
    .py-8 { padding-top: 32px; padding-bottom: 32px; }
    .gap-2 { gap: 8px; }
    .gap-3 { gap: 12px; }
    .gap-4 { gap: 16px; }
    .flex { display: flex; }
    .flex-wrap { flex-wrap: wrap; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .w-full { width: 100%; }
    .w-24 { width: 96px; }
    .text-center { text-align: center; }
    .text-right { text-align: right; }
    .font-bold { font-weight: 700; }
    .font-semibold { font-weight: 600; }
    .font-mono { font-family: monospace; }
    .relative { position: relative; }
    .absolute { position: absolute; }
  </style>
</head>
<body class="container">

  <!-- ========== ЭКРАН ВХОДА ========== -->
  <div id="login-screen" class="card" style="max-width: 400px; margin: 80px auto; text-align: center;">
    <div style="font-size: 48px; margin-bottom: 16px;">🔐</div>
    <h1 style="font-size:1.5rem; font-weight:700; margin-bottom:8px;">Админ-панель</h1>
    <p class="text-muted mb-6">IT-КУБ — управление платформой</p>
    <input type="password" id="admin-password" placeholder="Пароль" class="mb-4">
    <button onclick="adminLogin()" class="btn btn-primary w-full" style="justify-content: center; padding: 14px;">
      <i class="fas fa-arrow-right"></i> Войти
    </button>
    <p id="login-error" class="text-danger text-sm mt-4 hidden"></p>
  </div>

  <!-- ========== ЭКРАН УПРАВЛЕНИЯ ========== -->
  <div id="admin-screen" class="hidden">
    <div class="flex justify-between items-center mb-6 flex-wrap gap-3">
      <div class="flex items-center gap-3">
        <div style="width: 40px; height: 40px; background: var(--purple); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem;">⚙️</div>
        <h1 style="font-size:1.5rem; font-weight:700;">Панель управления</h1>
      </div>
      <button onclick="logoutAdmin()" class="btn btn-ghost"><i class="fas fa-sign-out-alt"></i> Выйти</button>
    </div>

    <!-- Вкладки -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab('events')"><i class="fas fa-calendar-alt mr-2"></i> Мероприятия</button>
      <button class="tab" onclick="switchTab('teams')"><i class="fas fa-users mr-2"></i> Команды</button>
      <button class="tab" onclick="switchTab('users')"><i class="fas fa-user-circle mr-2"></i> Пользователи</button>
    </div>

    <!-- ====== МЕРОПРИЯТИЯ ====== -->
    <div id="tab-events">
      <div class="card mb-6">
        <div class="card-header">
          <h2>📋 Список мероприятий</h2>
          <button onclick="showEventForm()" class="btn btn-success"><i class="fas fa-plus"></i> Создать</button>
        </div>
        <div id="events-list"></div>
      </div>

      <!-- Форма создания/редактирования -->
      <div id="event-form" class="card mb-6 hidden">
        <div class="card-header">
          <h2 id="form-title">Создание мероприятия</h2>
          <button onclick="document.getElementById('event-form').classList.add('hidden')" class="btn-icon"><i class="fas fa-times"></i></button>
        </div>
        <input type="hidden" id="event-id">
        <div class="form-grid mb-4">
          <div><label>Название</label><input type="text" id="ev-title" placeholder="Хакатон 2026"></div>
          <div><label>Дата</label><input type="text" id="ev-date" placeholder="15 июня 2026"></div>
          <div><label>Локация</label><input type="text" id="ev-location" placeholder="Москва"></div>
          <div><label>Всего мест</label><input type="number" id="ev-places" placeholder="60"></div>
          <div><label>Организатор</label><input type="text" id="ev-org-name" placeholder="IT-КУБ"></div>
          <div class="relative">
            <label>Цвет организатора</label>
            <input type="text" id="ev-org-color" placeholder="bg-purple-600" onclick="toggleColorPicker()" readonly style="cursor:pointer;">
            <div id="color-picker" class="hidden" style="position:absolute;top:100%;left:0;z-index:100;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:4px;box-shadow:var(--shadow);">
              <div onclick="pickColor('bg-red-500')" class="color-swatch" style="background:#ef4444;" title="Красный"></div>
              <div onclick="pickColor('bg-orange-500')" class="color-swatch" style="background:#f97316;" title="Оранжевый"></div>
              <div onclick="pickColor('bg-yellow-500')" class="color-swatch" style="background:#eab308;" title="Жёлтый"></div>
              <div onclick="pickColor('bg-emerald-500')" class="color-swatch" style="background:#10b981;" title="Зелёный"></div>
              <div onclick="pickColor('bg-teal-500')" class="color-swatch" style="background:#14b8a6;" title="Бирюзовый"></div>
              <div onclick="pickColor('bg-blue-500')" class="color-swatch" style="background:#3b82f6;" title="Синий"></div>
              <div onclick="pickColor('bg-indigo-500')" class="color-swatch" style="background:#6366f1;" title="Индиго"></div>
              <div onclick="pickColor('bg-purple-500')" class="color-swatch" style="background:#8b5cf6;" title="Фиолетовый"></div>
              <div onclick="pickColor('bg-purple-600')" class="color-swatch" style="background:#7c3aed;" title="Тёмно-фиолетовый"></div>
              <div onclick="pickColor('bg-pink-500')" class="color-swatch" style="background:#ec4899;" title="Розовый"></div>
              <div onclick="pickColor('bg-rose-500')" class="color-swatch" style="background:#f43f5e;" title="Розово-красный"></div>
              <div onclick="pickColor('bg-cyan-500')" class="color-swatch" style="background:#06b6d4;" title="Голубой"></div>
              <div onclick="pickColor('bg-sky-500')" class="color-swatch" style="background:#0ea5e9;" title="Небесный"></div>
              <div onclick="pickColor('bg-violet-500')" class="color-swatch" style="background:#8b5cf6;" title="Фиалковый"></div>
              <div onclick="pickColor('bg-fuchsia-500')" class="color-swatch" style="background:#d946ef;" title="Фуксия"></div>
            </div>
          </div>
          <div><label>Иконка (эмодзи)</label><input type="text" id="ev-org-icon" placeholder="💻"></div>
          <div><label>Направления (через запятую)</label><input type="text" id="ev-directions" placeholder="Backend, Frontend"></div>
        </div>
        <div class="mb-4"><label>Описание</label><textarea id="ev-description" placeholder="Подробное описание..."></textarea></div>
        <div class="mb-4">
          <div class="flex justify-between items-center mb-2">
            <label>Кейсы</label>
            <button onclick="addCase()" class="btn btn-ghost btn-sm"><i class="fas fa-plus"></i> Добавить</button>
          </div>
          <div id="cases-container"></div>
        </div>
        <div class="flex gap-3">
          <button onclick="document.getElementById('event-form').classList.add('hidden')" class="btn btn-ghost" style="flex:1; justify-content:center;">Отмена</button>
          <button onclick="saveEvent()" class="btn btn-success" style="flex:1; justify-content:center;">💾 Сохранить</button>
        </div>
      </div>
    </div>

    <!-- ====== КОМАНДЫ ====== -->
    <div id="tab-teams" class="hidden">
      <div class="card">
        <div class="card-header"><h2>👥 Команды</h2></div>
        <div id="teams-list"><p class="text-muted text-center py-8">Загрузка...</p></div>
      </div>
    </div>

    <!-- ====== ПОЛЬЗОВАТЕЛИ ====== -->
    <div id="tab-users" class="hidden">
      <div class="card">
        <div class="card-header">
          <h2>👤 Пользователи</h2>
          <input type="text" id="user-search" placeholder="🔍 Поиск по email или имени..." oninput="loadUsers()" style="max-width:300px;">
        </div>
        <div id="users-list"><p class="text-muted text-center py-8">Загрузка...</p></div>
      </div>
    </div>
  </div>

  <!-- ========== МОДАЛКА ПОДТВЕРЖДЕНИЯ ========== -->
  <div id="confirm-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <h3 style="font-size:1.25rem; font-weight:700; margin-bottom:8px;">Подтверждение</h3>
      <p class="text-muted mb-2" id="confirm-text"></p>
      <p class="text-danger text-sm mb-6">Действие необратимо</p>
      <div class="flex gap-3">
        <button onclick="closeConfirmModal()" class="btn btn-ghost" style="flex:1; justify-content:center;">Отмена</button>
        <button id="confirm-action-btn" class="btn btn-danger" style="flex:1; justify-content:center;">Удалить</button>
      </div>
    </div>
  </div>

  <script>
    const VERCEL_URL = 'https://itcube-2fa.vercel.app';
    let adminToken = null;
    let pendingAction = null;
    let pendingData = null;

    // ====== ВХОД ======
    async function adminLogin() {
      const password = document.getElementById('admin-password').value;
      const errEl = document.getElementById('login-error');
      const resp = await fetch(`${VERCEL_URL}/api/admin`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'login', password })
      });
      const data = await resp.json();
      if (data.success) {
        adminToken = data.token;
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('admin-screen').classList.remove('hidden');
        loadEvents();
      } else {
        errEl.textContent = 'Неверный пароль';
        errEl.classList.remove('hidden');
      }
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach((t, i) => {
        t.classList.remove('active');
        if ((tab === 'events' && i === 0) || (tab === 'teams' && i === 1) || (tab === 'users' && i === 2)) {
          t.classList.add('active');
        }
      });
      document.getElementById('tab-events').classList.toggle('hidden', tab !== 'events');
      document.getElementById('tab-teams').classList.toggle('hidden', tab !== 'teams');
      document.getElementById('tab-users').classList.toggle('hidden', tab !== 'users');
      if (tab === 'teams') loadTeams();
      if (tab === 'users') loadUsers();
    }

    // ====== ЦВЕТОВАЯ ПАЛИТРА ======
    function toggleColorPicker() {
      document.getElementById('color-picker').classList.toggle('hidden');
    }
    function pickColor(color) {
      document.getElementById('ev-org-color').value = color;
      document.getElementById('color-picker').classList.add('hidden');
    }
    document.addEventListener('click', function(e) {
      const picker = document.getElementById('color-picker');
      const input = document.getElementById('ev-org-color');
      if (picker && input && !picker.classList.contains('hidden') && e.target !== input && !picker.contains(e.target)) {
        picker.classList.add('hidden');
      }
    });

    // ====== МЕРОПРИЯТИЯ ======
    async function loadEvents() {
      const resp = await fetch(`${VERCEL_URL}/api/admin`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'get-events' })
      });
      const data = await resp.json();

      const countersResp = await fetch(`${VERCEL_URL}/api/admin`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'get-counters' })
      });
      const countersData = await countersResp.json();

      const container = document.getElementById('events-list');
      const list = data.events || [];
      if (list.length === 0) {
        container.innerHTML = '<p class="text-muted text-center py-8">Нет мероприятий</p>';
        return;
      }

      container.innerHTML = list.map(e => {
        const counter = (countersData.events || []).find(c => c.id === e.id);
        const freePlaces = counter ? counter.freePlaces : 0;
        const totalPlaces = e.totalPlaces || 0;
        const isFull = freePlaces >= totalPlaces;
        const isAdminClosed = e.status?.text === 'Регистрация закрыта';
        const isClosed = isFull || isAdminClosed;

        let statusText, statusBadge;
        if (isAdminClosed && !isFull) {
          statusText = 'Закрыто (админ)';
          statusBadge = 'badge-red';
        } else if (isFull) {
          statusText = 'Мест нет';
          statusBadge = 'badge-red';
        } else {
          statusText = 'Открыто';
          statusBadge = 'badge-green';
        }

        return `
        <div class="list-item" style="flex-direction:row; flex-wrap:wrap;">
          <div style="flex:1; min-width:200px;">
            <div class="list-item-title">${e.title} <span class="badge ${statusBadge}">${statusText}</span></div>
            <div class="list-item-sub mt-1">${e.date} • ${e.location}</div>
            <div class="list-item-sub mt-1" style="display:flex;flex-wrap:wrap;align-items:center;">
              <span class="badge badge-purple">Занято: ${freePlaces}/${totalPlaces}</span>
              <span class="badge badge-green" style="margin-left:4px;">${e.cases.length} кейсов</span>
              ${counter ? counter.caseFree.map((cf, i) => `<span class="badge ${cf <= 0 ? 'badge-red' : 'badge-yellow'}">Кейс ${i+1}: ${cf}</span>`).join('') : ''}
            </div>
          </div>
          <div class="flex gap-2" style="flex-shrink:0; flex-wrap:wrap; align-items:center;">
            ${!isFull || isAdminClosed ? `
            <button onclick="toggleEventStatus(${e.id})" class="btn btn-sm ${isClosed ? 'btn-success' : 'btn-danger'}" title="${isClosed ? 'Открыть регистрацию' : 'Закрыть регистрацию'}">
              <i class="fas ${isClosed ? 'fa-unlock' : 'fa-lock'}"></i> ${isClosed ? 'Открыть' : 'Закрыть'}
            </button>
            ` : ''}
            <button onclick="editEvent(${e.id})" class="btn-icon" title="Редактировать"><i class="fas fa-pen"></i></button>
            <button onclick="confirmDelete('event', ${e.id})" class="btn-icon danger" title="Удалить"><i class="fas fa-trash"></i></button>
          </div>
        </div>`;
      }).join('');
    }

    function showEventForm() {
      document.getElementById('event-form').classList.remove('hidden');
      document.getElementById('form-title').textContent = 'Создание мероприятия';
      document.getElementById('event-id').value = '';
      ['ev-title','ev-date','ev-location','ev-places','ev-org-name','ev-org-color','ev-org-icon','ev-directions','ev-description'].forEach(id => {
        document.getElementById(id).value = '';
      });
      document.getElementById('cases-container').innerHTML = '';
      for (let i = 0; i < 4; i++) addCase();
      document.getElementById('event-form').scrollIntoView({ behavior: 'smooth' });
    }

    function addCase() {
      const div = document.createElement('div');
      div.className = 'case-block';
      div.innerHTML = `
        <input type="text" placeholder="Описание кейса" class="case-text">
        <input type="number" placeholder="Мест" class="case-places w-24" value="15">
        <button onclick="this.parentElement.remove()" class="btn-icon danger btn-sm"><i class="fas fa-times"></i></button>
      `;
      document.getElementById('cases-container').appendChild(div);
    }

    async function saveEvent() {
      const id = document.getElementById('event-id').value;
      const cases = [];
      document.querySelectorAll('.case-block').forEach(block => {
        const text = block.querySelector('.case-text').value.trim();
        const places = block.querySelector('.case-places').value;
        if (text && places) cases.push({ text, places: parseInt(places) });
      });

      const payload = {
        action: id ? 'edit-event' : 'create-event',
        title: document.getElementById('ev-title').value,
        date: document.getElementById('ev-date').value,
        location: document.getElementById('ev-location').value,
        description: document.getElementById('ev-description').value,
        totalPlaces: document.getElementById('ev-places').value,
        organizerName: document.getElementById('ev-org-name').value,
        organizerColor: document.getElementById('ev-org-color').value,
        organizerIcon: document.getElementById('ev-org-icon').value,
        directions: document.getElementById('ev-directions').value,
        cases
      };
      if (id) payload.id = parseInt(id);

      const resp = await fetch(`${VERCEL_URL}/api/admin`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await resp.json();
      if (data.success) {
        document.getElementById('event-form').classList.add('hidden');
        loadEvents();
      } else {
        alert(data.error || 'Ошибка');
      }
    }

    async function editEvent(id) {
      const resp = await fetch(`${VERCEL_URL}/api/admin`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'get-events' })
      });
      const data = await resp.json();
      const event = data.events.find(e => e.id === id);
      if (!event) return;

      document.getElementById('event-form').classList.remove('hidden');
      document.getElementById('form-title').textContent = 'Редактирование мероприятия';
      document.getElementById('event-id').value = event.id;
      document.getElementById('ev-title').value = event.title;
      document.getElementById('ev-date').value = event.date;
      document.getElementById('ev-location').value = event.location;
      document.getElementById('ev-places').value = event.totalPlaces;
      document.getElementById('ev-org-name').value = event.organizer.text;
      document.getElementById('ev-org-color').value = event.organizer.color;
      document.getElementById('ev-org-icon').value = event.organizer.icon;
      document.getElementById('ev-directions').value = event.directions.join(', ');
      document.getElementById('ev-description').value = event.description;

      const container = document.getElementById('cases-container');
      container.innerHTML = '';
      event.cases.forEach((c, i) => {
        const div = document.createElement('div');
        div.className = 'case-block';
        div.innerHTML = `
          <input type="text" value="${c}" class="case-text">
          <input type="number" value="${event.caseLimits[i]}" class="case-places w-24">
          <button onclick="this.parentElement.remove()" class="btn-icon danger btn-sm"><i class="fas fa-times"></i></button>
        `;
        container.appendChild(div);
      });
      document.getElementById('event-form').scrollIntoView({ behavior: 'smooth' });
    }

    async function toggleEventStatus(id) {
      const resp = await fetch(`${VERCEL_URL}/api/admin`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'toggle-event-status', id })
      });
      const data = await resp.json();
      if (data.success) { loadEvents(); }
      else { alert(data.error || 'Ошибка'); }
    }

    // ====== КОМАНДЫ ======
    async function loadTeams() {
      const container = document.getElementById('teams-list');
      container.innerHTML = '<p class="text-muted text-center py-8">Загрузка...</p>';

      const resp = await fetch(`${VERCEL_URL}/api/admin`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'get-teams' })
      });
      const data = await resp.json();

      if (!data.teams || data.teams.length === 0) {
        container.innerHTML = '<p class="text-muted text-center py-8">Нет команд</p>';
        return;
      }

      container.innerHTML = data.teams.map(t => {
        const membersList = t.members.map(m => `
          <div class="member-row">
            <span>${m.name} ${m.role === 'Капитан' ? '⭐' : ''}</span>
            <span class="text-muted">${m.role || 'Участник'} • ${m.email}</span>
          </div>
        `).join('');

        return `
        <div class="list-item" style="flex-direction:column;">
          <div class="flex justify-between items-center flex-wrap gap-3 mb-3">
            <div>
              <div class="list-item-title">${t.teamName} <span class="badge badge-yellow">Кейс ${t.caseNum}</span></div>
              <div class="list-item-sub mt-1">${t.eventTitle}</div>
            </div>
            <div class="flex items-center gap-3">
              <div class="text-right">
                <div class="text-xs text-muted">Код приглашения</div>
                <div class="font-mono" style="color:var(--purple-light);font-size:0.9rem;font-weight:600;">${t.inviteCode}</div>
              </div>
              <button onclick="confirmDelete('team', '${t.inviteCode}')" class="btn-icon danger" title="Удалить"><i class="fas fa-trash"></i></button>
            </div>
          </div>
          <div class="team-detail-box">
            <div class="text-xs text-muted mb-2" style="font-weight:600;text-transform:uppercase;letter-spacing:0.5px;">👥 Участники (${t.members.length}/3)</div>
            ${membersList}
          </div>
          <div class="flex gap-4 flex-wrap mt-2">
            <div class="text-xs text-muted">📅 ${new Date(t.date).toLocaleDateString('ru-RU')}</div>
            <div class="text-xs text-muted">👑 Капитан: ${t.captainName}</div>
          </div>
        </div>`;
      }).join('');
    }

    // ====== ПОЛЬЗОВАТЕЛИ ======
    async function loadUsers() {
      const container = document.getElementById('users-list');
      container.innerHTML = '<p class="text-muted text-center py-8">Загрузка...</p>';

      const search = document.getElementById('user-search')?.value || '';

      const resp = await fetch(`${VERCEL_URL}/api/admin`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'get-users', search })
      });
      const data = await resp.json();

      if (!data.users || data.users.length === 0) {
        container.innerHTML = '<p class="text-muted text-center py-8">Нет пользователей</p>';
        return;
      }

      container.innerHTML = data.users.map(u => `
        <div class="list-item" style="flex-direction:row;">
          <div style="flex:1; min-width:200px;">
            <div class="list-item-title">${u.fullName || u.firstName + ' ' + u.lastName}</div>
            <div class="list-item-sub">${u.email} • ${u.phone || '—'}</div>
          </div>
          <button onclick="confirmDelete('user', '${u.email}')" class="btn-icon danger" title="Удалить"><i class="fas fa-trash"></i></button>
        </div>
      `).join('');
    }

    // ====== УДАЛЕНИЕ ======
    function confirmDelete(type, id) {
      pendingAction = type;
      pendingData = id;
      const texts = {
        event: 'Удалить мероприятие?',
        team: 'Удалить команду?',
        user: 'Удалить пользователя?'
      };
      document.getElementById('confirm-text').textContent = texts[type] || 'Удалить?';
      document.getElementById('confirm-modal').classList.remove('hidden');
    }

    function closeConfirmModal() {
      document.getElementById('confirm-modal').classList.add('hidden');
      pendingAction = null;
      pendingData = null;
    }

    document.getElementById('confirm-action-btn').addEventListener('click', async function() {
      if (pendingAction === 'event') {
        await fetch(`${VERCEL_URL}/api/admin`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'delete-event', id: pendingData })
        });
        loadEvents();
      } else if (pendingAction === 'team') {
        await fetch(`${VERCEL_URL}/api/teams`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'disband', inviteCode: pendingData, userEmail: 'admin' })
        });
        loadTeams();
      } else if (pendingAction === 'user') {
        await fetch(`${VERCEL_URL}/api/admin`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'delete-user', email: pendingData })
        });
        loadUsers();
      }
      closeConfirmModal();
    });

    function logoutAdmin() {
      adminToken = null;
      document.getElementById('login-screen').classList.remove('hidden');
      document.getElementById('admin-screen').classList.add('hidden');
    }
  </script>
</body>
</html>
