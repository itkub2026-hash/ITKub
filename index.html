<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT-КУБ — Мероприятия</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-950 text-gray-100">

  <nav class="bg-gray-900 border-b border-purple-500/30 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-gradient-to-br from-purple-600 to-indigo-600 rounded-2xl flex items-center justify-center text-white font-bold text-xl">IT</div>
        <h1 class="text-2xl font-bold">IT-КУБ</h1>
      </div>
    </div>
  </nav>

  <section id="home" class="min-h-screen">
    <div class="hero-bg py-20 text-center">
      <h1 class="text-5xl md:text-6xl font-bold mb-4">IT-мероприятия</h1>
      <p class="text-xl text-purple-200">Регистрируйся на хакатоны и кейс-чемпионаты</p>
    </div>
    <div class="max-w-7xl mx-auto px-6 py-12">
      <h2 class="text-3xl font-semibold mb-8">Актуальные мероприятия</h2>
      <div id="events-grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>
  </section>

  <section id="event-detail" class="hidden min-h-screen bg-gray-950">
    <div class="max-w-5xl mx-auto px-6 py-10">
      <button onclick="backToHome()" class="flex items-center gap-2 text-purple-400 hover:text-purple-300 mb-8 text-lg">← Назад к мероприятиям</button>
      <div id="event-detail-content" class="bg-gray-900 rounded-3xl overflow-hidden"></div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
