<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админка IT-КУБ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { background: #0f0f0f; color: #e0e0e0; font-family: 'Segoe UI', system-ui, sans-serif; }
    .admin-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 16px; padding: 24px; }
    input { background: #0f0f0f; border: 1px solid #2a2a2a; border-radius: 10px; padding: 10px 14px; color: #e0e0e0; width: 100%; }
    button { transition: all 0.2s; }
    .hidden { display: none !important; }
    .tabs { display: flex; gap: 0; margin-bottom: 24px; }
    .tab { padding: 12px 24px; background: #1a1a1a; border: 1px solid #2a2a2a; cursor: pointer; color: #999; font-weight: 500; }
    .tab:first-child { border-radius: 12px 0 0 12px; }
    .tab:last-child { border-radius: 0 12px 12px 0; }
    .tab.active { background: #4f46e5; color: white; border-color: #4f46e5; }
    .user-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #0f0f0f; border-radius: 12px; margin-bottom: 8px; }
    .user-row:hover { background: #1a1a1a; }
  </style>
</head>
<body class="p-8 max-w-5xl mx-auto">
  
  <!-- Экран входа -->
  <div id="login-screen" class="admin-card max-w-md mx-auto mt-20 text-center">
    <h1 class="text-2xl font-bold mb-6">🔐 Вход в админку</h1>
    <input type="password" id="admin-password" placeholder="Пароль" class="mb-4">
    <button onclick="adminLogin()" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 py-4 rounded-2xl font-semibold">Войти</button>
    <p id="login-error" class="text-red-400 text-sm mt-2 hidden"></p>
  </div>

  <!-- Экран управления -->
  <div id="admin-screen" class="hidden">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-3xl font-bold">⚙️ Админ-панель</h1>
      <button onclick="logoutAdmin()" class="bg-red-500/20 text-red-400 px-4 py-2 rounded-xl">Выйти</button>
    </div>

    <!-- Вкладки -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab('events')">Мероприятия</button>
      <button class="tab" onclick="switchTab('users')">Пользователи</button>
    </div>

    <!-- Вкладка Мероприятия -->
    <div id="tab-events" class="space-y-6">
      <div id="events-admin" class="space-y-6"></div>
      <div class="text-center">
        <button onclick="resetAll()" class="bg-red-600 hover:bg-red-700 px-8 py-4 rounded-2xl font-semibold">
          <i class="fas fa-exclamation-triangle mr-2"></i> Сбросить все счётчики
        </button>
      </div>
    </div>

    <!-- Вкладка Пользователи -->
    <div id="tab-users" class="hidden">
      <div id="users-list" class="space-y-2">
        <p class="text-gray-400 text-center">Загрузка...</p>
      </div>
    </div>
  </div>

  <!-- Модалка подтверждения удаления -->
  <div id="confirm-modal" class="hidden" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:1000;">
    <div class="admin-card max-w-sm w-full text-center">
      <h3 class="text-xl font-bold mb-4">Удалить аккаунт?</h3>
      <p class="text-gray-400 mb-2" id="confirm-email"></p>
      <p class="text-red-400 text-sm mb-6">Это действие нельзя отменить. Команды пользователя останутся.</p>
      <div class="flex gap-3">
        <button onclick="closeConfirmModal()" class="flex-1 bg-gray-700 hover:bg-gray-600 py-3 rounded-xl">Отмена</button>
        <button id="confirm-delete-btn" class="flex-1 bg-red-600 hover:bg-red-700 py-3 rounded-xl font-semibold">Удалить</button>
      </div>
    </div>
  </div>

  <script>
    const VERCEL_URL = 'https://itcube-2fa.vercel.app';
    let adminToken = null;
    let pendingDeleteEmail = null;

    async function adminLogin() {
      const password = document.getElementById('admin-password').value;
      const errEl = document.getElementById('login-error');
      
      const resp = await fetch(`${VERCEL_URL}/api/admin`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'login', password })
      });
      const data = await resp.json();
      
      if (data.success) {
        adminToken = data.token;
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('admin-screen').classList.remove('hidden');
        loadCounters();
      } else {
        errEl.textContent = 'Неверный пароль';
        errEl.classList.remove('hidden');
      }
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById('tab-events').classList.add('hidden');
      document.getElementById('tab-users').classList.add('hidden');
      
      if (tab === 'events') {
        document.querySelector('.tab:first-child').classList.add('active');
        document.getElementById('tab-events').classList.remove('hidden');
      } else {
        document.querySelector('.tab:last-child').classList.add('active');
        document.getElementById('tab-users').classList.remove('hidden');
        loadUsers();
      }
    }

    // ========== МЕРОПРИЯТИЯ ==========
    async function loadCounters() {
      const resp = await fetch(`${VERCEL_URL}/api/admin`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'get-counters' })
      });
      const data = await resp.json();
      renderAdminEvents(data.events || []);
    }

    function renderAdminEvents(eventsData) {
      const container = document.getElementById('events-admin');
      const names = ['Хакатон Цифровой Прорыв', 'IT-Cup Spring', 'DevFest Ростов'];
      const originalTotals = [120, 60, 40];
      
      container.innerHTML = eventsData.map((ev, i) => `
        <div class="admin-card">
          <h2 class="text-xl font-bold mb-4">${names[i] || 'Мероприятие ' + ev.id}</h2>
          <div class="grid grid-cols-2 gap-4 mb-4">
            <div>
              <label class="text-gray-400 text-sm">Всего мест</label>
              <input type="number" id="total-${ev.id}" value="${ev.totalPlaces || originalTotals[i]}" class="mt-1">
            </div>
            <div>
              <label class="text-gray-400 text-sm">Занято</label>
              <div class="text-2xl font-bold mt-2">${ev.freePlaces || 0}</div>
            </div>
          </div>
          <div class="grid grid-cols-4 gap-2 mb-4">
            ${(ev.caseLimits || [30,30,30,30]).map((lim, ci) => `
              <div>
                <label class="text-gray-400 text-xs">Кейс ${ci+1}</label>
                <input type="number" id="case-${ev.id}-${ci}" value="${lim}" class="mt-1 text-sm">
              </div>
            `).join('')}
          </div>
          <div class="flex gap-3">
            <button onclick="updateTotal(${ev.id})" class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded-xl text-sm">Сохранить места</button>
            <button onclick="updateCases(${ev.id})" class="bg-indigo-600 hover:bg-indigo-700 px-4 py-2 rounded-xl text-sm">Применить кейсы и сбросить</button>
          </div>
        </div>
      `).join('');
    }

    async function updateTotal(eventId) {
      const totalPlaces = parseInt(document.getElementById(`total-${eventId}`).value);
      await fetch(`${VERCEL_URL}/api/admin`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'update-total', eventId, totalPlaces })
      });
      alert('Обновлено!');
    }

    async function updateCases(eventId) {
      const caseLimits = [0,1,2,3].map(i => parseInt(document.getElementById(`case-${eventId}-${i}`).value));
      await fetch(`${VERCEL_URL}/api/admin`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'update-cases', eventId, caseLimits })
      });
      alert('Кейсы обновлены, счётчики сброшены!');
      loadCounters();
    }

    async function resetAll() {
      if (!confirm('Точно сбросить ВСЕ счётчики?')) return;
      await fetch(`${VERCEL_URL}/api/admin`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'reset-all' })
      });
      alert('Всё сброшено!');
      loadCounters();
    }

    // ========== ПОЛЬЗОВАТЕЛИ ==========
    async function loadUsers() {
      const container = document.getElementById('users-list');
      container.innerHTML = '<p class="text-gray-400 text-center">Загрузка...</p>';
      
      const resp = await fetch(`${VERCEL_URL}/api/admin`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'get-users' })
      });
      const data = await resp.json();
      
      if (!data.users || data.users.length === 0) {
        container.innerHTML = '<p class="text-gray-400 text-center">Нет зарегистрированных пользователей</p>';
        return;
      }
      
      container.innerHTML = data.users.map(u => `
        <div class="user-row">
          <div>
            <span class="text-white">${u.fullName || u.firstName + ' ' + u.lastName}</span>
            <span class="text-gray-500 ml-3">${u.email}</span>
            <span class="text-gray-600 ml-3 text-sm">${u.phone || ''}</span>
          </div>
          <button onclick="confirmDeleteUser('${u.email}')" class="text-red-400 hover:text-red-300 text-sm">
            <i class="fas fa-trash"></i>
          </button>
        </div>
      `).join('');
    }

    function confirmDeleteUser(email) {
      pendingDeleteEmail = email;
      document.getElementById('confirm-email').textContent = email;
      document.getElementById('confirm-modal').classList.remove('hidden');
    }

    function closeConfirmModal() {
      document.getElementById('confirm-modal').classList.add('hidden');
      pendingDeleteEmail = null;
    }

    document.getElementById('confirm-delete-btn').addEventListener('click', async function() {
      if (!pendingDeleteEmail) return;
      
      const resp = await fetch(`${VERCEL_URL}/api/admin`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'delete-user', email: pendingDeleteEmail })
      });
      const data = await resp.json();
      
      if (data.success) {
        closeConfirmModal();
        loadUsers();
      } else {
        alert(data.error || 'Ошибка удаления');
      }
    });

    function logoutAdmin() {
      adminToken = null;
      document.getElementById('login-screen').classList.remove('hidden');
      document.getElementById('admin-screen').classList.add('hidden');
    }
  </script>
</body>
</html>
